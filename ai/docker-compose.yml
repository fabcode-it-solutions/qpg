services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: qpg-ai-server
    restart: unless-stopped
    ports:
      - "3010:3010"
    volumes:
      - ./uploads:/app/uploads:rw
      - ./logs:/app/logs:rw
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qpg-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg17
    container_name: qpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qpg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./setup-database.sql:/docker-entrypoint-initdb.d/setup-database.sql
    networks:
      - qpg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qpg"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  qpg-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local