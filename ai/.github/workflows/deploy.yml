name: Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  DOCKER_IMAGE_NAME: qpg-ai-server
  AWS_REGION: ap-south-1
  ECS_CLUSTER_NAME: qpg_ai_server
  ECS_SERVICE_NAME: qpg-ai-server-task-service-weaw4uk3
  ECS_TASK_DEFINITION_NAME: qpg-ai-server-task

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci || {
            echo "npm ci failed, trying npm install as fallback"
            npm install
          }
          echo "Checking if esbuild is available..."
          npx esbuild --version

      - name: Run tests (if available)
        run: |
          if npm run test --if-present; then
            echo "Tests passed"
          else
            echo "No tests found or tests failed"
          fi

      - name: Build with esbuild
        run: |
          echo "Building with optimized esbuild..."
          echo "Checking if build.js exists..."
          ls -la build.js
          echo "Running build:prod..."
          npm run build:prod
          echo "Checking if build succeeded..."
          ls -la dist/
          echo "Build completed successfully!"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
